mutation { c31: productCreate(product:{title:"Personalised Wheelie Bin Sticker – Design 31", handle:"personalised-wheelie-bin-sticker-design-31", status:DRAFT, vendor:"Foxy Printing", productType:"Wheelie Bin Stickers", templateSuffix:"personalised", tags:["bin sticker", "foxy-new-2026", "foxy-src-dropbox", "house number sticker", "io-home-gifts", "machine-cut", "new home gift", "outdoor sticker", "personalised", "range-wheelie-bin", "wheelie bin sticker"], descriptionHtml:"<p>Give your bin a touch of the cottage garden with this personalised wheelie bin sticker, framed on both sides by tall, curling floral vines. Design 31 sets a big, classic house number in the middle with the name or street underneath, so it suits a short street name or even a house name. Our sample reads “68 Sarcel”.</p>\n<h2>Personalised Wheelie Bin Sticker – Design 31</h2>\n<p>Type your house number and street name into the boxes above the Add to Basket button and check the preview. We print and cut your sticker to order in our North Yorkshire workshop, with your details set in this design.</p>\n<h3>Why you’ll love it</h3>\n<ul>\n<li>Elegant floral vines that make a plain bin look cared for</li>\n<li>Large house number that’s easy to spot from the pavement</li>\n<li>Room for a short street or house name underneath</li>\n<li>Laminated outdoor vinyl that lasts 5+ years outside</li>\n<li>Choose a single sticker, a pair or a pack of 4 for every bin you own</li>\n</ul>\n<h3>Size &amp; details</h3>\n<ul>\n<li>Size: A5, 210 × 148 mm per sticker</li>\n<li>Material: laminated outdoor vinyl that lasts 5+ years outside</li>\n<li>Packs: single, pair (2 stickers) or pack of 4</li>\n<li>Personalised with your house number and street name</li>\n<li>Sample wording shown: 68 Sarcel</li>\n</ul>\n<h3>Delivery</h3>\n<p>Your stickers are made to order in our North Yorkshire workshop and posted from the UK. Delivery options and costs are shown at checkout. Any questions, call us on 01439 771468.</p>\n<p>Got a matching door sign or house plaque? This floral style sits nicely alongside it.</p>", seo:{title:"Personalised Wheelie Bin Sticker Design 31 | Foxy Printing", description:"Floral personalised wheelie bin sticker with your house number and street name. A5 laminated outdoor vinyl that lasts 5+ years. Single, pair or 4-pack."}, productOptions:[{name:"Pack", values:[{name:"Single"}, {name:"Pair"}, {name:"Pack of 4"}]}], metafields:[{namespace:"foxy", key:"mockup", type:"single_line_text_field", value:"flat"}, {namespace:"foxy", key:"personalise_fields", type:"list.single_line_text_field", value:"[\"House number\", \"Street name\"]"}, {namespace:"mm-google-shopping", key:"custom_product", type:"boolean", value:"true"}, {namespace:"mm-google-shopping", key:"condition", type:"single_line_text_field", value:"new"}, {namespace:"mm-google-shopping", key:"google_product_category", type:"single_line_text_field", value:"Home & Garden > Decor > Address Signs"}, {namespace:"mm-google-shopping", key:"gender", type:"single_line_text_field", value:"unisex"}, {namespace:"mm-google-shopping", key:"age_group", type:"single_line_text_field", value:"adult"}, {namespace:"mm-google-shopping", key:"color", type:"single_line_text_field", value:"Multicolor"}, {namespace:"mm-google-shopping", key:"mpn", type:"single_line_text_field", value:"FOXY-CUT-PWBSD31-01"}]}, media:[{originalSource:"https://d2ol7oe51mr4n9.cloudfront.net/user_3HUr7G8la20J0fiH66SaF8cNGi7/6a0fb8df-303f-4c6d-9867-7bd01fd102ad.jpg", alt:"Personalised wheelie bin sticker design 31 on a green wheelie bin, with the flat A5 sticker in front", mediaContentType:IMAGE}, {originalSource:"https://d2ol7oe51mr4n9.cloudfront.net/user_3HUr7G8la20J0fiH66SaF8cNGi7/b29f3759-6780-4ba2-815b-236755d0732f.jpg", alt:"Design 31 flat A5 sticker: the number 68 and the name Sarcel framed by tall floral vines", mediaContentType:IMAGE}, {originalSource:"https://d8j0ntlcm91z4.cloudfront.net/user_3HUr7G8la20J0fiH66SaF8cNGi7/hf_20261005_171057_522eed69-cfeb-492a-ba0c-923a203eccd7.png", alt:"Design 31 sticker on a green wheelie bin next to a front door and a potted plant", mediaContentType:IMAGE}]) { product { id handle } userErrors { field message } } c32: productCreate(product:{title:"Personalised Wheelie Bin Sticker – Design 32", handle:"personalised-wheelie-bin-sticker-design-32", status:DRAFT, vendor:"Foxy Printing", productType:"Wheelie Bin Stickers", templateSuffix:"personalised", tags:["bin sticker", "foxy-new-2026", "foxy-src-dropbox", "house number sticker", "io-home-gifts", "machine-cut", "new home gift", "outdoor sticker", "personalised", "range-wheelie-bin", "wheelie bin sticker"], descriptionHtml:"<p>This personalised wheelie bin sticker flips the usual layout: your street name runs across the top and the house number sits large in the centre, wrapped in ornate floral scrolls. It works brilliantly for single and double-digit numbers, where a big, bold figure really stands out. Our sample shows “Hospital Drove” above the number 6.</p>\n<h2>Personalised Wheelie Bin Sticker – Design 32</h2>\n<p>Type your house number and street name into the boxes above the Add to Basket button and check the preview. We print and cut your sticker to order in our North Yorkshire workshop, with your details set in this design.</p>\n<h3>Why you’ll love it</h3>\n<ul>\n<li>Street name across the top, so it reads like a proper house sign</li>\n<li>Ornate scrolls give a traditional, period feel</li>\n<li>Big centre number that’s easy to see on collection day</li>\n<li>Laminated outdoor vinyl that lasts 5+ years outside</li>\n<li>Choose a single sticker, a pair or a pack of 4 for every bin you own</li>\n</ul>\n<h3>Size &amp; details</h3>\n<ul>\n<li>Size: A5, 210 × 148 mm per sticker</li>\n<li>Material: laminated outdoor vinyl that lasts 5+ years outside</li>\n<li>Packs: single, pair (2 stickers) or pack of 4</li>\n<li>Personalised with your house number and street name</li>\n<li>Sample wording shown: Hospital Drove above a large 6</li>\n</ul>\n<h3>Delivery</h3>\n<p>Your stickers are made to order in our North Yorkshire workshop and posted from the UK. Delivery options and costs are shown at checkout. Any questions, call us on 01439 771468.</p>\n<p>Lovely for older houses and cottages, and a thoughtful little extra for anyone who’s just moved in.</p>", seo:{title:"Personalised Wheelie Bin Sticker Design 32 | Foxy Printing", description:"Ornate personalised wheelie bin sticker with your street name over a big house number. A5 laminated outdoor vinyl, lasts 5+ years. Single, pair or 4-pack."}, productOptions:[{name:"Pack", values:[{name:"Single"}, {name:"Pair"}, {name:"Pack of 4"}]}], metafields:[{namespace:"foxy", key:"mockup", type:"single_line_text_field", value:"flat"}, {namespace:"foxy", key:"personalise_fields", type:"list.single_line_text_field", value:"[\"House number\", \"Street name\"]"}, {namespace:"mm-google-shopping", key:"custom_product", type:"boolean", value:"true"}, {namespace:"mm-google-shopping", key:"condition", type:"single_line_text_field", value:"new"}, {namespace:"mm-google-shopping", key:"google_product_category", type:"single_line_text_field", value:"Home & Garden > Decor > Address Signs"}, {namespace:"mm-google-shopping", key:"gender", type:"single_line_text_field", value:"unisex"}, {namespace:"mm-google-shopping", key:"age_group", type:"single_line_text_field", value:"adult"}, {namespace:"mm-google-shopping", key:"color", type:"single_line_text_field", value:"Multicolor"}, {namespace:"mm-google-shopping", key:"mpn", type:"single_line_text_field", value:"FOXY-CUT-PWBSD32-01"}]}, media:[{originalSource:"https://d2ol7oe51mr4n9.cloudfront.net/user_3HUr7G8la20J0fiH66SaF8cNGi7/93077eea-9e90-47fe-96a4-49a8a64a42ed.jpg", alt:"Personalised wheelie bin sticker design 32 on a green wheelie bin, with the flat A5 sticker in front", mediaContentType:IMAGE}, {originalSource:"https://d2ol7oe51mr4n9.cloudfront.net/user_3HUr7G8la20J0fiH66SaF8cNGi7/a61bb07f-7d2a-4295-8346-89ac6f94b2db.jpg", 