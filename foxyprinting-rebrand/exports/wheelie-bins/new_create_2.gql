mutation { c34: productCreate(product:{title:"Personalised Wheelie Bin Sticker – Design 34", handle:"personalised-wheelie-bin-sticker-design-34", status:DRAFT, vendor:"Foxy Printing", productType:"Wheelie Bin Stickers", templateSuffix:"personalised", tags:["bin sticker", "foxy-new-2026", "foxy-src-dropbox", "house number sticker", "io-home-gifts", "machine-cut", "new home gift", "outdoor sticker", "personalised", "range-wheelie-bin", "wheelie bin sticker"], descriptionHtml:"<p>Bold and leafy, this personalised wheelie bin sticker cradles your house number in a sweeping fern wreath. The number sits large at the top of the wreath with the street name below, so it reads clearly from the kerb. Our sample shows “28 Gateacre Court”.</p>\n<h2>Personalised Wheelie Bin Sticker – Design 34</h2>\n<p>Type your house number and street name into the boxes above the Add to Basket button and check the preview. We print and cut your sticker to order in our North Yorkshire workshop, with your details set in this design.</p>\n<h3>Why you’ll love it</h3>\n<ul>\n<li>Sweeping fern leaves with a crisp, graphic finish</li>\n<li>Extra-large number at the top of the design</li>\n<li>A neat way to tell your bins apart from next door’s</li>\n<li>Laminated outdoor vinyl that lasts 5+ years outside</li>\n<li>Choose a single sticker, a pair or a pack of 4 for every bin you own</li>\n</ul>\n<h3>Size &amp; details</h3>\n<ul>\n<li>Size: A5, 210 × 148 mm per sticker</li>\n<li>Material: laminated outdoor vinyl that lasts 5+ years outside</li>\n<li>Packs: single, pair (2 stickers) or pack of 4</li>\n<li>Personalised with your house number and street name</li>\n<li>Sample wording shown: 28 Gateacre Court</li>\n</ul>\n<h3>Delivery</h3>\n<p>Your stickers are made to order in our North Yorkshire workshop and posted from the UK. Delivery options and costs are shown at checkout. Any questions, call us on 01439 771468.</p>\n<p>A great choice for new-build homes, and a handy housewarming extra for friends who’ve just moved.</p>", seo:{title:"Personalised Wheelie Bin Sticker Design 34 | Foxy Printing", description:"Fern wreath personalised wheelie bin sticker with your house number and street name. Printed on A5 laminated outdoor vinyl that lasts 5+ years. 1, 2 or 4."}, productOptions:[{name:"Pack", values:[{name:"Single"}, {name:"Pair"}, {name:"Pack of 4"}]}], metafields:[{namespace:"foxy", key:"mockup", type:"single_line_text_field", value:"flat"}, {namespace:"foxy", key:"personalise_fields", type:"list.single_line_text_field", value:"[\"House number\", \"Street name\"]"}, {namespace:"mm-google-shopping", key:"custom_product", type:"boolean", value:"true"}, {namespace:"mm-google-shopping", key:"condition", type:"single_line_text_field", value:"new"}, {namespace:"mm-google-shopping", key:"google_product_category", type:"single_line_text_field", value:"Home & Garden > Decor > Address Signs"}, {namespace:"mm-google-shopping", key:"gender", type:"single_line_text_field", value:"unisex"}, {namespace:"mm-google-shopping", key:"age_group", type:"single_line_text_field", value:"adult"}, {namespace:"mm-google-shopping", key:"color", type:"single_line_text_field", value:"Multicolor"}, {namespace:"mm-google-shopping", key:"mpn", type:"single_line_text_field", value:"FOXY-CUT-PWBSD34-01"}]}, media:[{originalSource:"https://d2ol7oe51mr4n9.cloudfront.net/user_3HUr7G8la20J0fiH66SaF8cNGi7/72b4c2fd-e207-4f6e-a3d4-f428baa3f26f.jpg", alt:"Personalised wheelie bin sticker design 34 on a green wheelie bin, with the flat A5 sticker in front", mediaContentType:IMAGE}, {originalSource:"https://d2ol7oe51mr4n9.cloudfront.net/user_3HUr7G8la20J0fiH66SaF8cNGi7/12dce669-efb1-488b-96a1-2a0ddfe4621c.jpg", alt:"Design 34 flat A5 sticker: large number 28 above a fern-leaf wreath with Gateacre Court underneath", mediaContentType:IMAGE}, {originalSource:"https://d8j0ntlcm91z4.cloudfront.net/user_3HUr7G8la20J0fiH66SaF8cNGi7/hf_20261005_172647_a903f610-5c3c-4801-b2a7-5854238223c1.png", alt:"Design 34 sticker on a blue recycling wheelie bin next to a white front door", mediaContentType:IMAGE}]) { product { id handle } userErrors { field message } } c35: productCreate(product:{title:"Personalised Wheelie Bin Sticker – Design 35", handle:"personalised-wheelie-bin-sticker-design-35", status:DRAFT, vendor:"Foxy Printing", productType:"Wheelie Bin Stickers", templateSuffix:"personalised", tags:["bin sticker", "foxy-new-2026", "foxy-src-dropbox", "house number sticker", "io-home-gifts", "machine-cut", "new home gift", "outdoor sticker", "personalised", "range-wheelie-bin", "wheelie bin sticker"], descriptionHtml:"<p>Curling leaf sprigs above and a leafy line with a heart below give this personalised wheelie bin sticker a light, botanical feel. There’s no heavy border, so the design feels open and airy, with the house number up top and the street name in the middle. Our sample reads “28 Gateacre Court”.</p>\n<h2>Personalised Wheelie Bin Sticker – Design 35</h2>\n<p>Type your house number and street name into the boxes above the Add to Basket button and check the preview. We print and cut your sticker to order in our North Yorkshire workshop, with your details set in this design.</p>\n<h3>Why you’ll love it</h3>\n<ul>\n<li>Botanical sprigs and a little heart for a friendly touch</li>\n<li>Open layout without a heavy frame</li>\n<li>Clear number and street name that are easy to read</li>\n<li>Laminated outdoor vinyl that lasts 5+ years outside</li>\n<li>Choose a single sticker, a pair or a pack of 4 for every bin you own</li>\n</ul>\n<h3>Size &amp; details</h3>\n<ul>\n<li>Size: A5, 210 × 148 mm per sticker</li>\n<li>Material: laminated outdoor vinyl that lasts 5+ years outside</li>\n<li>Packs: single, pair (2 stickers) or pack of 4</li>\n<li>Personalised with your house number and street name</li>\n<li>Sample wording shown: 28 Gateacre Court</li>\n</ul>\n<h3>Delivery</h3>\n<p>Your stickers are made to order in our North Yorkshire workshop and posted from the UK. Delivery options and costs are shown at checkout. Any questions, call us on 01439 771468.</p>\n<p>Pair it with a matching sticker on the garden waste bin so every bin finds its way home.</p>", seo:{title:"Personalised Wheelie Bin Sticker Design 35 | Foxy Printing", description:"Botanical personalised wheelie bin sticker with leaf sprigs, your house number and street. A5 laminated outdoor vinyl that lasts 5+ years. 1, 2 or 4 pack."}, productOptions:[{name:"Pack", values:[{name:"Single"}, {name:"Pair"}, {name:"Pack of 4"}]}], metafields:[{namespace:"foxy", key:"mockup", type:"single_line_text_field", value:"flat"}, {namespace:"foxy", key:"personalise_fields", type:"list.single_line_text_field", value:"[\"House number\", \"Street name\"]"}, {namespace:"mm-google-shopping", key:"custom_product", type:"boolean", value:"true"}, {namespace:"mm-google-shopping", key:"condition", type:"single_line_text_field", value:"new"}, {namespace:"mm-google-shopping", key:"google_product_category", type:"single_line_text_field", value:"Home & Garden > Decor > Address Signs"}, {namespace:"mm-google-shopping", key:"gender", type:"single_line_text_field", value:"unisex"}, {namespace:"mm-google-shopping", key:"age_group", type:"single_line_text_field", value:"adult"}, {namespace:"mm-google-shopping", key:"color", type:"single_line_text_field", value:"Multicolor"}, {namespace:"mm-google-shopping", key:"mpn", type:"single_line_text_field", value:"FOXY-CUT-PWBSD35-01"}]}, media:[{originalSource:"https://d2ol7oe51mr4n9.cloudfront.net/user_3HUr7G8la20J0fiH66SaF8cNGi7/74577660-c96c-4065-ba31-553bb5051cd1.jpg", alt:"Personalised wheelie bin sticker design 35 on a green wheelie bin, with the flat A5 sticker in front", mediaContentType:IMAGE}, {originalSource:"https://d2ol7oe51mr4n9.cloudfront.net/user_3HUr7G8la20J0fiH66SaF8cNGi7/c47dc438-db3b-40c2-8c2d-6d30c57dd6dc.jpg", alt:"Design 35 flat A5 sticker: number 28 between curling leaf sprigs with Gateacre Court and a leafy heart line below", mediaContentType:IMAGE}