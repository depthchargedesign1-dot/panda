mutation { u21: productUpdate(product:{id:"gid://shopify/Product/16052587331965", descriptionHtml:"<p>Stop the bin-day mix-ups with a personalised wheelie bin sticker that shows your house number loud and clear. Design 21 is one of our numbered house-number styles, ready for your own number and street.</p>\n<h2>Personalised Wheelie Bin Sticker – Design 21</h2>\n<p>Pop your house number and street name into the boxes above the Add to Basket button.</p>\n<h3>Why you'll love it</h3>\n<ul>\n<li>Helps bin crews and neighbours return your bin to the right house</li>\n<li>Clear, bold layout in our design 21 style</li>\n<li>A pair of stickers in every order</li>\n<li>Laminated so it keeps looking smart for 5+ years outdoors</li>\n<li>Cut and printed in our own workshop</li>\n</ul>\n<h3>Size &amp; details</h3>\n<ul>\n<li>Pack: pair (2 stickers)</li>\n<li>Personalised with your house number and street name</li>\n<li>Size: A5, 210 × 148 mm per sticker</li>\n<li>Material: laminated outdoor vinyl that lasts 5+ years outside</li>\n</ul>\n<h3>Delivery</h3>\n<p>Your stickers are made to order in our North Yorkshire workshop and posted from the UK. Delivery options and costs are shown at checkout. Any questions, call us on 01439 771468.</p>\n<p>Moving house? A pair of these makes a handy new home gift alongside a personalised door sign.</p>", seo:{title:"Personalised Wheelie Bin Sticker Design 21 | Foxy Printing", description:"Design 21 personalised wheelie bin stickers with your house number and street. Type in your details, then we print your pair in North Yorkshire."}, metafields:[{namespace:"foxy", key:"personalise_fields", type:"list.single_line_text_field", value:"[\"House number\", \"Street name\"]"}]}) { userErrors { field message } } u22: productUpdate(product:{id:"gid://shopify/Product/16052587364733", descriptionHtml:"<p>A personalised wheelie bin sticker is the easiest way to make sure your bin comes back to the right drive after collection day. Design 22 is one of our n