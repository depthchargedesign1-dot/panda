mutation { u11: productUpdate(product:{id:"gid://shopify/Product/16052585988477", descriptionHtml:"<p>Stop the bin-day mix-ups with a personalised wheelie bin sticker that shows your house number loud and clear. Design 11 puts the number front and centre (our sample shows \"79\"), and you can add your street name too.</p>\n<h2>Personalised Wheelie Bin Sticker – Design 11</h2>\n<p>Fill in your number and street in the boxes above the Add to Basket button and we’ll set them in this design for you.</p>\n<h3>Why you'll love it</h3>\n<ul>\n<li>Ends the \"whose bin is it?\" debate for good</li>\n<li>Design 11 keeps the number big and readable from the kerb</li>\n<li>Supplied as a pair: one for each side, or one each for two bins</li>\n<li>A cheap, cheerful way to smarten up the front of your house</li>\n<li>Made to order by a small UK team</li>\n</ul>\n<h3>Size &amp; details</h3>\n<ul>\n<li>Pack: pair (2 stickers)</li>\n<li>Personalised with your house number and street name</li>\n<li>Size: A5, 210 × 148 mm per sticker</li>\n<li>Material: laminated outdoor vinyl that lasts 5+ years outside</li>\n</ul>\n<h3>Delivery</h3>\n<p>Your stickers are made to order in our North Yorkshire workshop and posted from the UK. Delivery options and costs are shown at checkout. Any questions, call us on 01439 771468.</p>\n<p>Moving house? A pair of these makes a handy new home gift alongside a personalised door sign.</p>", seo:{title:"Personalised Wheelie Bin Sticker Design 11 | Foxy Printing", description:"Make your bin easy to spot: a pair of personalised wheelie bin stickers (design 11) with your number and street, on A5 laminated outdoor vinyl."}, metafields:[{namespace:"foxy", key:"personalise_fields", type:"list.single_line_text_field", value:"[\"House number\", \"Street name\"]"}]}) { userErrors { field message } } u12: productUpdate(product:{id:"gid://shopify/Product/16052586054013", descriptionHtml:"<p>A personalised wheelie bin sticker is the easiest way to make sure your bin comes back to the right drive after collection day. In our sample artwork for design 12 it reads \"56 Anywhere Avenue\", but yours will show your own address.</p>\n<h2>Personalised Wheelie Bin Sticker – Design 12</h2>\n<p>Type in the details you want, such as your house number and street name, in the boxes above the Add to Basket button.</p>\n<h3>Why you'll love it</h3>\n<ul>\n<li>Ends the \"whose bin is it?\" debate for good</li>\n<li>Design 12 keeps the number big and readable from the kerb</li>\n<li>Supplied as a pair: one for each side, or one each for two bins</li>\n<li>A cheap, cheerful way to smarten up the front of your house</li>\n<li>Made to order by a small UK team</li>\n</ul>\n<h3>Size &amp; details</h3>\n<ul>\n<li>Pack: pair (2 stickers)</li>\n<li>Personalised with your house number and street name</li>\n<li>Size: A5, 210 × 148 mm per sticker</li>\n<li>Material: laminated outdoor vinyl that lasts 5+ years outside</li>\n</ul>\n<h3>Delivery</h3>\n<p>Your stickers are made to order in our North Yorkshire workshop and posted from the UK. Delivery options and costs are shown at checkout. Any questions, call us on 01439 771468.</p>\n<p>Want the whole street matching? Give us a ring and we'll help with bulk orders.</p>", seo:{title:"Personalised Wheelie Bin Sticker Design 12 | Foxy Printing", description:"Design 12 personalised wheelie bin stickers with your house number and street. Type in your details, then we print your pair in North Yorkshire."}, metafields:[{namespace:"foxy", key:"personalise_fields", type:"list.single_line_text_field", value:"[\"House number\", \"Street name\"]"}]}) { userErrors { field message } } u13: productUpdate(product:{id:"gid://shopify/Product/16052586709373", descriptionHtml:"<p>Tired of your neighbours borrowing your bin? This personalised wheelie bin sticker puts your house number and street name where everyone can see it. In our sample artwork for design 13 it reads \"123 Anywhere\", but yours will show your own address.</p>\n<h2>Personalised Wheelie Bin Sticker – Design 13</h2>\n<p>Pop your house number and street name into the boxes above the Add to Basket button.</p>\n<h3>Why you'll love it</h3>\n<ul>\n<li>Helps bin crews and neighbours return your bin to the right house</li>\n<li>Clear, bold layout in our design 13 style</li>\n<li>A pair of stickers in every order</li>\n<li>Laminated so it keeps looking smart for 5+ years outdoors</li>\n<li>Cut and printed in our own workshop</li>\n</ul>\n<h3>Size &amp; details</h3>\n<ul>\n<li>Pack: pair (2 stickers)</li>\n<li>Personalised with your house number and street name</li>\n<li>Size: A5, 210 × 148 mm per sticker</li>\n<li>Material: laminated outdoor vinyl that lasts 5+ years outside</li>\n</ul>\n<h3>Delivery</h3>\n<p>Your stickers are made to order in our North Yorkshire workshop and posted from the UK. Delivery options and costs are shown at checkout. Any questions, call us on 01439 771468.</p>\n<p>Got more than one bin? Add a pair for each so every bin finds its way home.</p>", seo:{title:"Personalised Wheelie Bin Sticker Design 13 | Foxy Printing", description:"Personalised wheelie bin sticker, design 13, with your house number and street name. Sold as a pair, printed in-house in the UK. Order yours today."}, metafields:[{namespace:"foxy", key:"personalise_fields", type:"list.single_line_text_field", value:"[\"House number\", \"Street name\"]"}]}) { userErrors { field message } } u14: productUpdate(product:{id:"gid://shopify/Product/16052586742141", descriptionHtml:"<p>Give a plain grey or green bin a smart, tidy finish with a personalised wheelie bin sticker made just for your home. In our sample artwork for design 14 it reads \"28 Knowhere\", but yours will show your own address.</p>\n<h2>Personalised Wheelie Bin Sticker – Design 14</h2>\n<p>Just add your house number and your street name. We cut and print your pair to order.</p>\n<h3>Why you'll love it</h3>\n<ul>\n<li>Helps bin crews and neighbours return your bin to the right house</li>\n<li>Clear, bold layout in our design 14 style</li>\n<li>A pair of stickers in every order</li>\n<li>Laminated so it keeps looking smart for 5+ years outdoors</li>\n<li>Cut and printed in our own workshop</li>\n</ul>\n<h3>Size &amp; details</h3>\n<ul>\n<li>Pack: pair (2 stickers)</li>\n<li>Personalised with your house number and street name</li>\n<li>Size: A5, 210 × 148 mm per sticker</li>\n<li>Material: laminated outdoor vinyl that lasts 5+ years outside</li>\n</ul>\n<h3>Delivery</h3>\n<p>Your stickers are made to order in our North Yorkshire workshop and posted from the UK. Delivery options and costs are shown at checkout. Any questions, call us on 01439 771468.</p>\n<p>Pair them with a personalised door sign for a front of house that looks cared for.</p>", seo:{title:"Personalised Wheelie Bin Sticker Design 14 | Foxy Printing", description:"Make your bin easy to spot: a pair of personalised wheelie bin stickers (design 14) with your number and street, on A5 laminated outdoor vinyl."}, metafields:[{namespace:"foxy", key:"personalise_fields", type:"list.single_line_text_field", value:"[\"House number\", \"Street name\"]"}]}) { userErrors { field message } } u15: productUpdate(product:{id:"gid://shopify/Product/16052586774909", descriptionHtml:"<p>Bin day is so much easier when you can spot your own bin from the end of the street. This personalised wheelie bin sticker does exactly that. In our sample artwork for design 15 it reads \"42 Believe Close\", but yours will show your own address.</p>\n<h2>Personalised Wheelie Bin Sticker – Design 15</h2>\n<p>Fill in your number and street in the boxes above the Add to Basket button and we’ll set them in this design for you.</p>\n<h3>Why you'll love it</h3>\n<ul>\n<li>Clear house number that stands out on grey, black, green or blue bins</li>\n<li>Design 15 adds a neat finish to your street name</li>\n<li>Two stickers per pack</li>\n<li>Great as a new home gift or a housewarming extra</li>\n<li>Printed in-house in North Yorkshire</li>\n</ul>\n<h3>Size &amp; details</h3>\n<ul>\n<li>Pack: pair (2 stickers)</li>\n<li>Personalised with your house number and street name</li>\n<li>Size: A5, 210 × 148 mm per sticker</li>\n<li>Material: laminated outdoor vinyl that lasts 5+ years outside</li>\n</ul>\n<h3>Delivery</h3>\n<p>Your stickers are made to order in our North Yorkshire workshop and posted from the UK. Delivery options and costs are shown at checkout. Any questions, call us on 01439 771468.</p>\n<p>Buying for a new neighbour? A pair of personalised bin stickers is a thoughtful housewarming touch.</p>", seo:{title:"Personalised Wheelie Bin Sticker Design 15 | Foxy Printing", description:"Design 15 personalised wheelie bin stickers with your house number and street. Type in your details, then we print your pair in North Yorkshire."}, metafields:[{namespace:"foxy", key:"personalise_fields", type:"list.single_line_text_field", value:"[\"House number\", \"Street name\"]"}]}) { userErrors { field message } } }