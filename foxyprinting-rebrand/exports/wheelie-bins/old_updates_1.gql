mutation { u1: productUpdate(product:{id:"gid://shopify/Product/16052583498109", descriptionHtml:"<p>Stop the bin-day mix-ups with a personalised wheelie bin sticker that shows your house number loud and clear. In our sample artwork for design 1 it reads \"28 Back End of Knowhere\", but yours will show your own address.</p>\n<h2>Personalised Wheelie Bin Sticker – Design 1</h2>\n<p>Pop your house number and street name into the boxes above the Add to Basket button.</p>\n<h3>Why you'll love it</h3>\n<ul>\n<li>Makes your bin easy to spot on collection day</li>\n<li>Your own house number and street name, laid out in design 1</li>\n<li>Comes as a pair, so you can do the front and lid, or two bins</li>\n<li>Laminated so it keeps looking smart for 5+ years outdoors</li>\n<li>Printed and cut in-house in North Yorkshire</li>\n</ul>\n<h3>Size &amp; details</h3>\n<ul>\n<li>Pack: pair (2 stickers)</li>\n<li>Personalised with your house number and street name</li>\n<li>Size: A5, 210 × 148 mm per sticker</li>\n<li>Material: laminated outdoor vinyl that lasts 5+ years outside</li>\n</ul>\n<h3>Delivery</h3>\n<p>Your stickers are made to order in our North Yorkshire workshop and posted from the UK. Delivery options and costs are shown at checkout. Any questions, call us on 01439 771468.</p>\n<p>Moving house? A pair of these makes a handy new home gift alongside a personalised door sign.</p>", seo:{title:"Personalised Wheelie Bin Sticker Design 1 | Foxy Printing", description:"Personalised wheelie bin sticker, design 1, with your house number and street name. Sold as a pair, printed in-house in the UK. Order yours today."}, metafields:[{namespace:"foxy", key:"personalise_fields", type:"list.single_line_text_field", value:"[\"House number\", \"Street name\"]"}]}) { userErrors { field message } } u2: productUpdate(product:{id:"gid://shopify/Product/16052583596413", descriptionHtml:"<p>A personalised wheelie bin sticker is the easiest way to make sure your bin comes back to the right drive after collection day. In our sample artwork for design 2 it reads \"74 Make Believe Close\", but yours will show your own address.</p>\n<h2>Personalised Wheelie Bin Sticker – Design 2</h2>\n<p>Just add your house number and your street name. We cut and print your pair to order.</p>\n<h3>Why you'll love it</h3>\n<ul>\n<li>Makes your bin easy to spot on collection day</li>\n<li>Your own house number and street name, laid out in design 2</li>\n<li>Comes as a pair, so you can do the front and lid, or two bins</li>\n<li>Laminated so it keeps looking smart for 5+ years outdoors</li>\n<li>Printed and cut in-house in North Yorkshire</li>\n</ul>\n<h3>Size &amp; details</h3>\n<ul>\n<li>Pack: pair (2 stickers)</li>\n<li>Personalised with your house number and street name</li>\n<li>Size: A5, 210 × 148 mm per sticker</li>\n<li>Material: laminated outdoor vinyl that lasts 5+ years outside</li>\n</ul>\n<h3>Delivery</h3>\n<p>Your stickers are made to order in our North Yorkshire workshop and posted from the UK. Delivery options and costs are shown at checkout. Any questions, call us on 01439 771468.</p>\n<p>Want the whole street matching? Give us a ring and we'll help with bulk orders.</p>", seo:{title:"Personalised Wheelie Bin Sticker Design 2 | Foxy Printing", description:"Make your bin easy to spot: a pair of personalised wheelie bin stickers (design 2) with your number and street, on A5 laminated outdoor vinyl."}, metafields:[{namespace:"foxy", key:"personalise_fields", type:"list.single_line_text_field", value:"[\"House number\", \"Street name\"]"}]}) { userErrors { field message } } u3: productUpdate(product:{id:"gid://shopify/Product/16052583661949", descriptionHtml:"<p>Tired of your neighbours borrowing your bin? This personalised wheelie bin sticker puts your house number and street name where everyone can see it. In our sample artwork for design 3 it reads \"42 Knowhere Avenue\", but yours will show your own address.</p>\n<h2>Personalised Wheelie Bin Sticker – Design 3</h2>\n<p>Fill in your number and street in the boxes above the Add to Basket button and we’ll set them in this design for you.</p>\n<h3>Why you'll love it</h3>\n<ul>\n<li>Ends the \"whose bin is it?\" debate for good</li>\n<li>Design 3 keeps the number big and readable from the kerb</li>\n<li>Supplied as a pair: one for each side, or one each for two bins</li>\n<li>A cheap, cheerful way to smarten up the front of your house</li>\n<li>Made to order by a small UK team</li>\n</ul>\n<h3>Size &amp; details</h3>\n<ul>\n<li>Pack: pair (2 stickers)</li>\n<li>Personalised with your house number and street name</li>\n<li>Size: A5, 210 × 148 mm per sticker</li>\n<li>Material: laminated outdoor vinyl that lasts 5+ years outside</li>\n</ul>\n<h3>Delivery</h3>\n<p>Your stickers are made to order in our North Yorkshire workshop and posted from the UK. Delivery options and costs are shown at checkout. Any questions, call us on 01439 771468.</p>\n<p>Got more than one bin? Add a pair for each so every bin finds its way home.</p>", seo:{title:"Personalised Wheelie Bin Sticker Design 3 | Foxy Printing", description:"Design 3 personalised wheelie bin stickers with your house number and street. Type in your details, then we print your pair in North Yorkshire."}, metafields:[{namespace:"foxy", key:"personalise_fields", type:"list.single_line_text_field", value:"[\"House number\", \"Street name\"]"}]}) { userErrors { field message } } u4: productUpdate(product:{id:"gid://shopify/Product/16052583727485", descriptionHtml:"<p>Give a plain grey or green bin a smart, tidy finish with a personalised wheelie bin sticker made just for your home. In our sample artwork for design 4 it reads \"42 Clueless Close\", but yours will show your own address.</p>\n<h2>Personalised Wheelie Bin Sticker – Design 4</h2>\n<p>Type in the details you want, such as your house number and street name, in the boxes above the Add to Basket button.</p>\n<h3>Why you'll love it</h3>\n<ul>\n<li>Ends the \"whose bin is it?\" debate for good</li>\n<li>Design 4 keeps the number big and readable from the kerb</li>\n<li>Supplied as a pair: one for each side, or one each for two bins</li>\n<li>A cheap, cheerful way to smarten up the front of your house</li>\n<li>Made to order by a small UK team</li>\n</ul>\n<h3>Size &amp; details</h3>\n<ul>\n<li>Pack: pair (2 stickers)</li>\n<li>Personalised with your house number and street name</li>\n<li>Size: A5, 210 × 148 mm per sticker</li>\n<li>Material: laminated outdoor vinyl that lasts 5+ years outside</li>\n</ul>\n<h3>Delivery</h3>\n<p>Your stickers are made to order in our North Yorkshire workshop and posted from the UK. Delivery options and costs are shown at checkout. Any questions, call us on 01439 771468.</p>\n<p>Pair them with a personalised door sign for a front of house that looks cared for.</p>", seo:{title:"Personalised Wheelie Bin Sticker Design 4 | Foxy Printing", description:"Personalised wheelie bin sticker, design 4, with your house number and street name. Sold as a pair, printed in-house in the UK. Order yours today."}, metafields:[{namespace:"foxy", key:"personalise_fields", type:"list.single_line_text_field", value:"[\"House number\", \"Street name\"]"}]}) { userErrors { field message } } u5: productUpdate(product:{id:"gid://shopify/Product/16052583760253", descriptionHtml:"<p>Bin day is so much easier when you can spot your own bin from the end of the street. This personalised wheelie bin sticker does exactly that. Design 5 puts the number front and centre (our sample shows \"24\"), and you can add your street name too.</p>\n<h2>Personalised Wheelie Bin Sticker – Design 5</h2>\n<p>Pop your house number and street name into the boxes above the Add to Basket button.</p>\n<h3>Why you'll love it</h3>\n<ul>\n<li>Helps bin crews and neighbours return your bin to the right house</li>\n<li>Clear, bold layout in our design 5 style</li>\n<li>A pair of stickers in every order</li>\n<li>Laminated so it keeps looking smart for 5+ years outdoors</li>\n<li>Cut and printed in our own workshop</li>\n</ul>\n<h3>Size &amp; details</h3>\n<ul>\n<li>Pack: pair (2 stickers)</li>\n<li>Personalised with your house number and street name</li>\n<li>Size: A5, 210 × 148 mm per sticker</li>\n<li>Material: laminated outdoor vinyl that lasts 5+ years outside</li>\n</ul>\n<h3>Delivery</h3>\n<p>Your stickers are made to order in our North Yorkshire workshop and posted from the UK. Delivery options and costs are shown at checkout. Any questions, call us on 01439 771468.</p>\n<p>Buying for a new neighbour? A pair of personalised bin stickers is a thoughtful housewarming touch.</p>", seo:{title:"Personalised Wheelie Bin Sticker Design 5 | Foxy Printing", description:"Make your bin easy to spot: a pair of personalised wheelie bin stickers (design 5) with your number and street, on A5 laminated outdoor vinyl."}, metafields:[{namespace:"foxy", key:"personalise_fields", type:"list.single_line_text_field", value:"[\"House number\", \"Street name\"]"}]}) { userErrors { field message } } }