mutation { productCreate(product:{title:"BTS Face Masks – 5-Pack Party Set: Jimin, V, RM, Suga & J-Hope Card Masks", handle:"bts-face-masks-5-pack-party-set", status:ACTIVE, vendor:"Foxy Printing", productType:"Celebrity Facemask", category:"gid://shopify/TaxonomyCategory/aa-3-4", tags:["Band Face Masks", "BTS", "Cardboard Face Masks", "Celebrity Face Mask", "Celebrity Party Masks", "celebrity-face-mask", "Costume Mask", "Face Mask", "Facemask", "Fancy Dress", "foxy-mask-pack", "foxy-new-2026", "foxy-range-celebrity-masks", "foxy-trending-oct2026", "Hen Party Mask", "K-Pop Face Mask", "kpop-masks", "Mask Pack", "mask-music", "mask-packs-couples", "Music Fancy Dress", "MUSIC STARS", "new-arrivals", "Photo Booth Prop", "STAG & HEN PARTY FACE MASKS", "third-party-name", "TV Stars And Celebrity Masks"], descriptionHtml:"<p>Our BTS face mask pack puts five members of the K-pop group in one envelope, so you and your friends can turn up to a concert pre-party, a fan meet-up or a themed birthday as the boys themselves. Line up for a group photo and see who guesses who.</p>\n<h2>BTS Face Mask Pack – 5 Card Masks for K-Pop Fans</h2>\n<p>Inside are five masks: Jimin, V (Kim Taehyung), RM (Kim Namjoon), Suga (Min Yoongi) and J-Hope (Jung Hoseok). We print every face in full colour on thick 350gsm silk card, cut each one to the shape of the face and cut out the eye holes. Elastic and sticky tabs are supplied for you to attach.</p>\n<h3>Why you'll love it</h3>\n<ul>\n<li>A ready-made group costume for five K-pop fans, all in one order</li>\n<li>Thick 350gsm silk card that holds its shape through a whole night of dancing</li>\n<li>Semi-waterproof finish, so a spilt drink won't spoil the party</li>\n<li>Eye holes come cut out, so you can still see the stage</li>\n</ul>\n<h3>Size &amp; details</h3>\n<ul>\n<li>Contents: 5 masks (Jimin, V, RM, Suga and J-Hope)</li>\n<li>Size: each mask is 297 x 210 mm (A4), a full adult-size face</li>\n<li>Material: 350gsm silk card, full-colour digital print</li>\n<li>Fitting: elastic and sticky tabs supplied for you to attach</li>\n<li>Packaging: posted flat in a board-backed envelope</li>\n</ul>\n<h3>Delivery</h3>\n<p>Printed in our UK workshop and posted to you. Dispatch and postage options are shown at checkout.</p>\n<p>Just want your favourite? Each mask is sold singly too: <a href=\"/products/jimin-bts-face-mask\">Jimin</a>, <a href=\"/products/v-kim-taehyung-bts-face-mask\">V</a>, <a href=\"/products/rm-kim-namjoon-bts-face-mask\">RM</a>, <a href=\"/products/suga-min-yoongi-bts-face-mask\">Suga</a> and <a href=\"/products/j-hope-jung-hoseok-bts-face-mask\">J-Hope</a> (see all our <a href=\"/collections/k-pop-face-masks\">K-pop face masks</a>).</p>\n<h3>Please note</h3>\n<p class=\"disclaimer\">This is an unofficial novelty product made for fun and fancy dress. Jimin, V (Kim Taehyung), RM (Kim Namjoon), Suga (Min Yoongi) and J-Hope (Jung Hoseok) have not endorsed, sponsored or approved this product, and Foxy Printing has no connection with them. Their names are used only to describe the design. It is also an unofficial fan design, not endorsed by or connected with BTS, their management or record label. All names and trademarks belong to their respective owners.</p>", seo:{title:"K-Pop Boy Band Face Mask 5-Pack | Foxy Printing", description:"Five K-pop star card face masks in one pack: Jimin, V, RM, Suga and J-Hope. Cut to shape with eye holes, elastic supplied. Great for fan parties."}, metafields:[{namespace:"mm-google-shopping", key:"custom_product", type:"boolean", value:"true"}, {namespace:"mm-google-shopping", key:"condition", type:"single_line_text_field", value:"new"}, {namespace:"mm-google-shopping", key:"google_product_category", type:"single_line_text_field", value:"Apparel & Accessories > Costumes & Accessories > Masks"}, {namespace:"mm-google-shopping", key:"gender", type:"single_line_text_field", value:"unisex"}, {namespace:"mm-google-shopping", key:"age_group", type:"single_line_text_field", value:"adult"}, {namespace:"mm-google-shopping", key:"color", type:"single_line_text_field", value:"Multicolor"}, {namespace:"mm-google-shopping", key:"mpn", type:"single_line_text_field", value:"FaceMask-BTS5Pack"}, {namespace:"shopify", key:"fabric", type:"list.metaobject_reference", value:"[\"gid://shopify/Metaobject/562294882685\"]"}, {namespace:"shopify", key:"age-group", type:"list.metaobject_reference", value:"[\"gid://shopify/Metaobject/283517714813\"]"}, {namespace:"shopify", key:"target-gender", type:"list.metaobject_reference", value:"[\"gid://shopify/Metaobject/283517747581\"]"}, {namespace:"shopify", key:"usage-type", type:"list.metaobject_reference", value:"[\"gid://shopify/Metaobject/283517813117\"]"}]}, media:[{originalSource:"https://shopify-staged-uploads.storage.googleapis.com/tmp/17749115/files/75f41472-4027-4dc1-a1c4-436dd4d66549/bts-face-masks-5-pack-party-set.jpg", alt:"BTS face mask pack: five printed card masks of Jimin, V, RM, Suga and J-Hope side by side", mediaContentType:IMAGE}]) { product { id handle variants(first:5) { nodes { id title } } media(first:2) { nodes { id } } } userErrors { field message } } }