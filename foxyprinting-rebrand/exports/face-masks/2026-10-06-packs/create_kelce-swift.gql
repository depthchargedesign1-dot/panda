mutation { productCreate(product:{title:"Travis Kelce & Taylor Swift Couple Face Mask Pair – Celebrity Couple Card Masks – Fancy Dress & Hen Party Props", handle:"travis-kelce-and-taylor-swift-couple-face-mask-pair", status:ACTIVE, vendor:"Foxy Printing", productType:"Celebrity Facemask", category:"gid://shopify/TaxonomyCategory/aa-3-4", tags:["American Football", "Cardboard Face Masks", "Celebrity Couples", "Celebrity Face Mask", "Celebrity Party Masks", "celebrity-face-mask", "Costume Mask", "couple-masks", "Face Mask", "Facemask", "Fancy Dress", "foxy-mask-pack", "foxy-new-2026", "foxy-range-celebrity-masks", "foxy-trending-oct2026", "Hen Party Mask", "Mask Pack", "mask-music", "mask-nfl", "mask-packs-couples", "mask-sport", "mask-stag-hen", "Music Fancy Dress", "MUSIC STARS", "new-arrivals", "Photo Booth Prop", "Singers", "Sport Celebrities", "SPORTS STARS", "STAG & HEN PARTY FACE MASKS", "third-party-name", "TV Stars And Celebrity Masks"], descriptionHtml:"<p>This Travis Kelce and Taylor Swift face mask pair is the easiest couple's costume going, whether it's a hen do, an engagement party, a big-game watch party or a pop-themed birthday. One of you is the American football star, the other is the pop superstar, and everyone in the room will get it straight away.</p>\n<h2>Travis Kelce and Taylor Swift Face Masks – Celebrity Couple Pair</h2>\n<p>You get two masks in one order, one of each half of the couple. We print both faces in full colour on thick 350gsm silk card. Ready to Wear masks arrive cut to the shape of the face with the eye holes cut out; DIY masks are printed only, so you cut them out yourselves and save a little. The elastic and sticky tabs are supplied with both styles for you to attach.</p>\n<h3>Why you'll love it</h3>\n<ul>\n<li>An instant couples costume for two, ideal for a bride and groom to be</li>\n<li>Thick 350gsm silk card that won't flop halfway through the first dance</li>\n<li>Semi-waterproof finish, so a spilt glass of fizz won't ruin 