mutation { productCreate(product:{title:"Liam & Noel Gallagher Face Masks – Brothers Pair – Britpop Fancy Dress Card Masks", handle:"liam-and-noel-gallagher-face-masks-brothers-pair", status:ACTIVE, vendor:"Foxy Printing", productType:"Celebrity Facemask", category:"gid://shopify/TaxonomyCategory/aa-3-4", tags:["Britpop", "Cardboard Face Masks", "Celebrity Face Mask", "Celebrity Party Masks", "celebrity-face-mask", "Costume Mask", "couple-masks", "Face Mask", "Facemask", "Fancy Dress", "foxy-mask-pack", "foxy-new-2026", "foxy-range-celebrity-masks", "foxy-trending-oct2026", "Hen Party Mask", "Mask Pack", "mask-music", "mask-packs-couples", "mask-stag-hen", "Music Fancy Dress", "MUSIC STARS", "new-arrivals", "Oasis", "Photo Booth Prop", "STAG & HEN PARTY FACE MASKS", "Stag Do Mask", "third-party-name", "TV Stars And Celebrity Masks"], descriptionHtml:"<p>These Liam and Noel Gallagher face masks are made for two mates who fancy turning up as rock and roll's most famous brothers. Wear them to a Britpop night, a gig pre-drinks or a stag do singalong, and expect a mock argument or two.</p>\n<h2>Liam and Noel Gallagher Face Masks – Brothers Pair</h2>\n<p>You get two masks in one order: Liam and Noel, the brothers behind Oasis. We print each face in full colour on thick 350gsm silk card. Choose Ready to Wear and both masks come cut to the shape of the face with the eye holes cut out. Choose DIY and they come printed only, for you to cut out at home. Either way, the elastic and sticky tabs are supplied for you to attach.</p>\n<h3>Why you'll love it</h3>\n<ul>\n<li>A double act costume for two, no wigs needed</li>\n<li>Printed on 350gsm silk card that stays stiff all night</li>\n<li>Semi-waterproof finish, handy for festival fields and beer gardens</li>\n<li>Ready to Wear eye holes come cut out, so you can still find the bar</li>\n</ul>\n<h3>Size &amp; details</h3>\n<ul>\n<li>Contents: 2 masks (Liam Gallagher and Noel Gallagher)</li>\n<li>Size: each mask is 297 x 210 mm (A4), a full adult-size face</li>\n<li>Material: 350gsm silk card, full-colour digital print</li>\n<li>Style: Ready to Wear (cut to shape, eye holes cut) or DIY (printed only)</li>\n<li>Fitting: elastic and sticky tabs supplied for you to attach</li>\n<li>Packaging: posted flat in a board-backed envelope</li>\n</ul>\n<h3>Delivery</h3>\n<p>Printed in our UK workshop and posted to you. Dispatch and postage options are shown at checkout.</p>\n<p>Bringing the whole crew? Add more <a href=\"/collections/music-celebrities\">music star face masks</a>, or buy a single <a href=\"/products/liam-gallagher-face-mask\">Liam</a> or <a href=\"/products/gallagher-face-mask\">Noel</a> mask.</p>\n<h3>Please note</h3>\n<p class=\"disclaimer\">This is an unofficial novelty product made for fun and fancy dress. Liam Gallagher and Noel Gallagher have not endorsed, sponsored or approved this product, and Foxy Printing has no connection with them. Their names are used only to describe the design. It is also an unofficial fan design, not endorsed by or connected with Oasis, their management or record label. All names and trademarks belong to their respective owners.</p>", seo:{title:"Liam & Noel Gallagher Face Masks Pair | Foxy Printing", description:"Turn up as Britpop's famous brothers with a pair of Liam and Noel Gallagher card face masks. Ready to Wear or DIY, elastic and tabs supplied."}, productOptions:[{name:"Style", values:[{name:"Ready to Wear"}, {name:"DIY"}]}], metafields:[{namespace:"mm-google-shopping", key:"custom_product", type:"boolean", value:"true"}, {namespace:"mm-google-shopping", key:"condition", type:"single_line_text_field", value:"new"}, {namespace:"mm-google-shopping", key:"google_product_category", type:"single_line_text_field", value:"Apparel & Accessories > Costumes & Accessories > Masks"}, {namespace:"mm-google-shopping", key:"gender", type:"single_line_text_field", value:"unisex"}, {namespace:"mm-google-shopping", key:"age_group", type:"single_line_text_field", value:"adult"}, {namespace:"mm-google-shopping", key:"color", type:"single_line_text_field", value:"Multicolor"}, {namespace:"mm-google-shopping", key:"mpn", type:"single_line_text_field", value:"FaceMask-LiamNoelGallagherPair"}, {namespace:"shopify", key:"fabric", type:"list.metaobject_reference", value:"[\"gid://shopify/Metaobject/562294882685\"]"}, {namespace:"shopify", key:"age-group", type:"list.metaobject_reference", value:"[\"gid://shopify/Metaobject/283517714813\"]"}, {namespace:"shopify", key:"target-gender", type:"list.metaobject_reference", value:"[\"gid://shopify/Metaobject/283517747581\"]"}, {namespace:"shopify", key:"usage-type", type:"list.metaobject_reference", value:"[\"gid://shopify/Metaobject/283517813117\"]"}]}, media:[{originalSource:"https://shopify-staged-uploads.storage.googleapis.com/tmp/17749115/files/e8e34b42-4102-4384-b73e-9499e9c9ad81/liam-and-noel-gallagher-face-masks-brothers-pair.jpg", alt:"Liam and Noel Gallagher face masks, two printed card masks side by side", mediaContentType:IMAGE}]) { product { id handle variants(first:5) { nodes { id title } } media(first:2) { nodes { id } } } userErrors { field message } } }