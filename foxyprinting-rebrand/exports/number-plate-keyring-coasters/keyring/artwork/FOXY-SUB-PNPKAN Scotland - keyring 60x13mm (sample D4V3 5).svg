<text x="5.800" y="13.200" font-family="Barlow Condensed" font-weight="700" font-size="3.714" fill="#FFFFFF" text-anchor="middle">SCO</text>
<text id="Plate text" x="35.650" y="12.290" font-family="Barlow Condensed" font-weight="700" font-size="12.257" letter-spacing="0.429" fill="#111111" text-anchor="middle" xml:space="preserve">D4V3 5</text>
