<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Leavers Hoodie Designer — demo</title>
  <link rel="stylesheet" href="../theme/assets/leavers-designer.css">
  <style>
    body { margin: 0; background: #fff; font-family: system-ui, sans-serif; color: #1D1240; }
    .wrap { max-width: 1360px; margin: 0 auto; padding: 20px 16px 60px; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
    .bar a { padding: 7px 12px; border-radius: 999px; border: 1.5px solid #ddd; text-decoration: none; color: inherit; font-weight: 700; font-size: .9rem; }
    .bar a[aria-current] { background: #1D1240; color: #fff; border-color: #1D1240; }
    pre { background: #f6f2ee; padding: 12px; border-radius: 12px; overflow: auto; font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar" id="garments"></div>
    <h1 id="title" style="margin:6px 0 16px"></h1>
    <div id="designer"></div>
    <section id="basket" hidden>
      <h2>Basket lines (demo)</h2>
      <p>On the live store these go to <code>/cart/add.js</code>. Open a line's print-file link to get the 300 dpi files.</p>
      <div id="lines"></div>
    </section>
  </div>
  <script src="../theme/assets/leavers-engine.js"></script>
  <script>
    document.head.insertAdjacentHTML('beforeend', '<link rel="stylesheet" href="' + LeaversEngine.fontsCssUrl() + '">');
  </script>
  <script src="../theme/assets/leavers-designer.js"></script>
  <script>
    var key = new URLSearchParams(location.search).get('garment') || LeaversEngine.DEFAULT_PRODUCT;
    var P = LeaversEngine.PRODUCTS;
    document.getElementById('garments').innerHTML = Object.keys(P).map(function (k) {
      return '<a href="?garment=' + k + '"' + (k === key ? ' aria-current="page"' : '') + '>' + P[k].name + '</a>';
    }).join('');
    document.getElementById('title').textContent = P[key].name;
    window.app = LeaversDesigner.mount(document.getElementById('designer'), {
      product: key,
      demo: true,
      studioUrl: new URL('print-studio.html', location.href).href,
      onDemoOrder: function (lines) {
        document.getElementById('basket').hidden = false;
        document.getElementById('lines').innerHTML = lines.map(function (l) {
          var link = l.properties['_Print files'];
          return '<pre>' + JSON.stringify(l, null, 2).replace(/</g, '&lt;') + '</pre><p><a target="_blank" href="' + link + '">Open print files for this line →</a></p>';
        }).join('');
      }
    });
  </script>
</body>
</html>
