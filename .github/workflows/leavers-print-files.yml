# Saves the 300 dpi print files for every new leavers hoodie / jacket order to Dropbox:
#   /Leavers Hoodie and Jackets ORDERS/<order number>/
# Runs every 15 minutes. Orders are tagged "leavers-files-saved" in Shopify once done, so each is only saved once.
# Run it by hand from the Actions tab ("Run workflow"); give an order number to redo just that order.
name: Leavers print files

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      order:
        description: 'Order number to (re)do, e.g. 60455 — leave empty for all new orders'
        required: false
  repository_dispatch:
    types: [leavers-order]

concurrency:
  group: leavers-print-files
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: leavers-designer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        working-directory: leavers-designer
        run: |
          npm install --no-save --no-package-lock playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Render and save print files
        working-directory: leavers-designer
        env:
          SHOPIFY_SHOP: naughty-but-nice-mugs.myshopify.com
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          ORDER: ${{ github.event.inputs.order || github.event.client_payload.order }}
        run: node tools/order-sync.mjs ${ORDER:+--order "$ORDER"}
